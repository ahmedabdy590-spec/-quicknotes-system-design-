<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>QuickNotes</h1>
      <p>Load, create, and delete notes using the practice API.</p>

      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status" aria-live="polite"></p>

      <form id="note-form">
        <div>
          <label for="title-input">Title</label>
          <input
            id="title-input"
            name="title"
            type="text"
            maxlength="100"
            required
          />
        </div>

        <div>
          <label for="body-input">Note</label>
          <textarea id="body-input" name="body" rows="5"></textarea>
        </div>

        <button id="submit-btn" type="submit">Create note</button>
      </form>

      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </main>
  </body>
</html>
